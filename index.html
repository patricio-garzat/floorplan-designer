<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Simple Floor Plan Designer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=20260930w">
</head>
<body>
  <div id="app" data-mode="plan">
    <header id="topbar">
      <div class="brand" title="Simple Floor Plan Designer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V3h18v18z"/><path d="M3 12h9v9M12 3v5M16 12h5"/></svg>
      </div>
      <div class="title">
        <input id="projName" spellcheck="false" maxlength="60" aria-label="Nombre del proyecto" placeholder="Mi plano">
        <span id="projArea" class="chip-area"></span>
        <span id="saveState" class="save-state"></span>
      </div>
      <div class="seg" id="modeSeg">
        <button data-mode="plan" class="on">Plano</button>
        <button data-mode="pres">Presentación</button>
        <button data-mode="3d">3D</button>
      </div>
      <div class="actions">
        <button class="ib" id="btnUndo" title="Deshacer (Ctrl/Cmd+Z)"></button>
        <button class="ib" id="btnRedo" title="Rehacer (Ctrl/Cmd+Shift+Z)"></button>
        <span class="sep"></span>
        <button class="tb" id="btnProjects" title="Mis proyectos"><span>Proyectos</span></button>
        <button class="tb" id="btnSave" title="Guardar (Ctrl/Cmd+S)"><span>Guardar</span></button>
        <button class="tb" id="btnRandom" title="Generar un diseño aleatorio"><span>Aleatorio</span></button>
        <div class="menu-wrap">
          <button class="tb primary" id="btnExport"><span>Exportar</span></button>
          <div id="exportMenu" class="menu">
            <button data-exp="png"><b>PNG</b><small>Imagen del plano</small></button>
            <button data-exp="svg"><b>SVG</b><small>Vectorial, editable</small></button>
            <button data-exp="pdf"><b>PDF</b><small>Lámina con escala y fecha</small></button>
          </div>
        </div>
      </div>
    </header>

    <nav id="toolbar" aria-label="Herramientas"></nav>

    <main id="stageWrap">
      <svg id="stage" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="view3d"></div>
      <div id="load3d" hidden>Cargando vista 3D…</div>
      <div id="flyout"></div>
      <div id="levelBar" class="level-bar"></div>
      <button id="walkBtn" class="walk-btn"><span>Recorrer la casa</span></button>
      <button id="walkExit" class="walk-exit">Salir · Esc</button>
      <button id="walkClip" class="walk-clip" title="Tecla C"></button>
      <div class="walk-lv"><button id="walkUp" title="Subir un nivel (Re Pág)" hidden>▲ Subir</button><span id="walkLevel" hidden></span><button id="walkDown" title="Bajar un nivel (Av Pág)" hidden>▼ Bajar</button></div>
      <div id="crosshair"></div>
      <canvas id="minimap" width="200" height="150"></canvas>
      <div id="hint"></div>
      <button id="shotBtn" class="shot-btn"><span>Capturar · Espacio</span></button>
      <div id="flash"></div>
      <div id="shots" class="shots"><div class="shots-head"><b id="shotsN"></b><span><button data-a="all">Descargar todas</button><button data-a="clear">Vaciar</button></span></div><div class="shots-row"></div></div>
      <div class="corner-left">
        <button class="tg on" id="tgDims" title="Mostrar/ocultar medidas"><span>Medidas</span></button>
        <button class="tg on" id="tgGrid" title="Mostrar/ocultar cuadrícula"><span>Cuadrícula</span></button>
        <button class="tg on" id="tgSnap" title="Imán inteligente (mantén Alt para desactivar)"><span>Imán</span></button>
      </div>
      <div class="corner-right">
        <button class="ib sm" id="zoomOut" title="Alejar"></button>
        <button class="ib sm" id="zoomIn" title="Acercar"></button>
        <button class="ib sm" id="zoomFit" title="Ajustar a la pantalla"></button>
      </div>
    </main>

    <aside id="panel"></aside>
  </div>

  <div id="start" class="overlay"></div>
  <div id="projects" class="overlay"></div>
  <div id="toast"></div>

  <script src="js/core.js?v=20260930w"></script>
  <script src="js/levels.js?v=20260930w"></script>
  <script src="js/furniture.js?v=20260930w"></script>
  <script src="js/catalog2.js?v=20260930w"></script>
  <script src="js/catalog3.js?v=20260930w"></script>
  <script src="js/rooms.js?v=20260930w"></script>
  <script src="js/walls.js?v=20260930w"></script>
  <script src="js/openings.js?v=20260930w"></script>
  <script src="js/measure.js?v=20260930w"></script>
  <script src="js/snap.js?v=20260930w"></script>
  <script src="js/render.js?v=20260930w"></script>
  <script src="js/storage.js?v=20260930w"></script>
  <script src="js/exporter.js?v=20260930w"></script>
  <script src="js/models3d.js?v=20260930w"></script>
  <script src="js/models3d2.js?v=20260930w"></script>
  <script src="js/models3d3.js?v=20260930w"></script>
  <script src="js/people.js?v=20260930w"></script>
  <script src="js/garden.js?v=20260930w"></script>
  <script src="js/lamps.js?v=20260930w"></script>
  <script src="js/games.js?v=20260930w"></script>
  <script src="js/stairs.js?v=20260930w"></script>
  <script src="js/cars.js?v=20260930w"></script>
  <script src="assets/dvd-logo.js?v=20260930w"></script>
  <script src="js/view3d.js?v=20260930w"></script>
  <script src="js/levelbar.js?v=20260930w"></script>
  <script src="js/actions.js?v=20260930w"></script>
  <script src="js/editor.js?v=20260930w"></script>
  <script src="js/ui.js?v=20260930w"></script>
  <script src="js/panel.js?v=20260930w"></script>
  <script src="js/generator.js?v=20260930w"></script>
  <script src="js/shots.js?v=20260930w"></script>
  <script src="js/dialogs.js?v=20260930w"></script>
  <script src="js/main.js?v=20260930w"></script>
</body>
</html>
